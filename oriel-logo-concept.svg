<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" />
  <!-- Bay window shape (oriel) -->
  <rect x="52" y="65" width="96" height="85" rx="8" fill="#0d1117" opacity="0.85" />
  <!-- Window panes -->
  <rect x="58" y="72" width="26" height="38" rx="4" fill="#e2e8f0" opacity="0.9" />
  <rect x="87" y="72" width="26" height="38" rx="4" fill="#e2e8f0" opacity="0.7" />
  <rect x="116" y="72" width="26" height="38" rx="4" fill="#e2e8f0" opacity="0.9" />
  <!-- Window base/sill -->
  <rect x="48" y="115" width="104" height="6" rx="2" fill="#14b8a6" opacity="0.8" />
  <!-- Bottom section -->
  <rect x="52" y="124" width="96" height="20" rx="4" fill="#0d1117" opacity="0.7" />
  <!-- Container icon (small box) -->
  <rect x="85" y="129" width="30" height="10" rx="2" fill="#14b8a6" opacity="0.6" />
</svg>
